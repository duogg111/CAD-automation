name: Python unit tests

on:
  push:
    branches:
      - feature/natural-language-cad
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser and geometry-planning tests
        run: python -m unittest discover -s tests -v
